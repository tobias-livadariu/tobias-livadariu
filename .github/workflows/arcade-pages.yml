name: Publish profile arcade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "arcade/**"
      - "scripts/build-arcade.mjs"
      - "assets/generated/iosevka-term-regular.ascii.subset.woff2"
      - ".github/workflows/arcade-pages.yml"

permissions: {}
concurrency:
  group: profile-arcade-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/build-arcade.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
