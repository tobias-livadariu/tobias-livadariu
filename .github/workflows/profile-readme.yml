name: Profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    paths:
      - "scripts/render-profile-readme.mjs"
      - "scripts/ascii-image-pipeline.mjs"
      - "scripts/ascii-image-profiles.mjs"
      - "scripts/profile-readme.config.mjs"
      - "scripts/ascii-frames-cache.mjs"
      - "assets/generated/island-ascii-frames.json"
      - "assets/generated/iosevka-term-regular.ascii.subset.woff2"
      - "assets/source/islands-1.png"
      - "assets/source/islands-1.json"
      - ".github/workflows/profile-readme.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned to a commit, not a tag. A moved tag is how the widely used
        # actions get compromised in practice; a SHA cannot be repointed.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # No install step: the render replays the committed ASCII frame cache and
      # runs on Node's standard library alone. playwright-core is a dev-only
      # dependency used by `npm run build:frames`, which is run locally.
      - name: Render profile terminal
        run: node scripts/render-profile-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. A personal access token with `repo` lets the render count
          # commits in private repositories into the {PRIVATE} bucket, which the
          # workflow's own token cannot see. Everything else renders without it.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit generated SVG
        run: |
          profile_svg_path="$(node -e 'import("./scripts/profile-readme.config.mjs").then(({ PROFILE_SVG_PATH }) => process.stdout.write(PROFILE_SVG_PATH))')"

          if [[ -z "$(git status --porcelain "$profile_svg_path" README.md)" ]]; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$profile_svg_path" README.md
          git commit -m "chore: refresh profile terminal"
          git push
