version: 2

updates:
  # The render job pins its actions to commit SHAs so a moved version tag cannot
  # repoint them at hostile code. Pinning alone would freeze the job on whatever
  # commit it started with, so Dependabot moves the pins forward.
  #
  # The cooldown is the point. A compromised release of a popular action is
  # normally caught within a day or two of publication, so adopting nothing
  # until it has been public for a week means this repository is never among the
  # first to run it. Security updates are exempt from the cooldown, so a fix for
  # a disclosed vulnerability still arrives immediately: the delay applies to
  # routine version bumps, not to patches.
  #
  # Updates merge on their own once the render smoke test passes, because a pull
  # request nobody has time to read is just a stale pin with extra steps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
