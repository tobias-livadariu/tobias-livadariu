version: 2

updates:
  # The workflow pins its actions to commit SHAs so that a moved version tag
  # cannot repoint them at hostile code. The cost of pinning is that a fix
  # published upstream never arrives on its own, which would leave a known
  # vulnerability sitting in a job that holds PROFILE_TOKEN.
  #
  # Dependabot closes that gap: it watches the actions this repository uses and
  # opens a pull request moving each pin to the new commit, with the release
  # notes attached. Updates stay immutable and become a thing to review rather
  # than something that changes underneath the workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
